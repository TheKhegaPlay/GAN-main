<div class="column">
  <h3>{{ title }}</h3>

  <form class="add-form" (ngSubmit)="onAdd()">
    <input [(ngModel)]="newFilename" name="filename" placeholder="filename.png" />
    <select [(ngModel)]="newModel" name="model">
      <option>ESRGAN</option>
      <option>GFPGAN</option>
      <option>SRGAN</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <div class="items">
    <app-evidence-item
      *ngFor="let e of evidences"
      [evidence]="e"
      (advance)="onAdvance($event)"
      (remove)="onRemove($event)">
    </app-evidence-item>

    <div *ngIf="evidences.length === 0" class="empty">No items</div>
  </div>
</div>
